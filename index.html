<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おかいものシミュレーター</title>
<style>
  :root {
    --bg: #fdf6e3;
    --surface: #fff8e7;
    --border: #e8d5a3;
    --text: #3d2c00;
    --sub: #8a6f3a;
    --accent: #e8913a;
    --accent2: #d06020;
    --correct: #4caf50;
    --wrong: #e05050;
    --cancel: #a0a0a0;
    --selected-glow: #f7c060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: 'BIZ UDPGothic', 'BIZ UDGothic', sans-serif;
    background: var(--bg);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    display: none; position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
  }
  .screen.active { display: flex; }

  /* ========== MAIN SCREEN ========== */
  #main-screen {
    flex-direction: row;
    align-items: stretch;
    padding: 6px 8px;
    gap: 8px;
  }

  /* 左カラム: ボタン群 */
  #left-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
    justify-content: flex-start;
    flex-shrink: 0;
    padding-top: 4px;
  }

  /* 商品カード */
  #product-card {
    background: white;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 100px;
  }
  #product-emoji {
    font-size: 52px;
    line-height: 1;
  }
  #product-price {
    font-size: 22px;
    font-weight: bold;
    color: var(--text);
    border: 2px solid var(--text);
    border-radius: 8px;
    padding: 3px 10px;
    background: white;
    white-space: nowrap;
  }

  /* アクションボタン */
  .action-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    padding: 10px 16px;
    border-radius: 22px;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s, opacity 0.12s;
    width: 100%;
    text-align: center;
  }
  .action-btn:active { transform: scale(0.93); }

  #btn-pay {
    background: var(--accent);
    color: white;
  }
  #btn-pay.disabled {
    background: #d0b880;
    opacity: 0.6;
    pointer-events: none;
  }
  #btn-cant {
    background: #d8c8a0;
    color: var(--sub);
  }
  #btn-back {
    background: #e8e0d0;
    color: var(--sub);
    font-size: 13px;
    padding: 8px 12px;
  }

  /* 右カラム: さいふ */
  #wallet-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  #wallet-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--sub);
    text-align: left;
    padding-left: 2px;
  }

  /* さいふエリア */
  #wallet-area {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* 金種行 */
  .denom-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: nowrap;
    padding: 4px 2px;
    border-bottom: 1px solid var(--border);
    min-height: 52px;
  }
  .denom-row:last-child { border-bottom: none; }

  /* コイン/お札ボタン */
  .money-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    flex-shrink: 0;
    transition: transform 0.1s;
  }
  .money-btn:active { transform: scale(0.88); }
  .money-btn.selected svg circle:first-child,
  .money-btn.selected svg rect:first-child {
    filter: drop-shadow(0 0 6px var(--selected-glow));
  }
  .money-btn.selected .coin-overlay,
  .money-btn.selected .note-overlay {
    opacity: 1;
  }
  .coin-overlay, .note-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%;
    background: rgba(247,192,96,0.38);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .note-overlay { border-radius: 6px; }

  /* 払い中アニメーション */
  @keyframes flyPay {
    0%   { transform: scale(1) translateY(0); opacity: 1; }
    60%  { transform: scale(0.7) translateY(-30px); opacity: 0.7; }
    100% { transform: scale(0.3) translateY(-80px); opacity: 0; }
  }
  .money-btn.paying {
    animation: flyPay 0.45s ease forwards;
  }

  /* 出しているおかね欄 */
  #paying-area {
    background: #f0e8d0;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    min-height: 38px;
  }
  #paying-label {
    font-size: 12px;
    color: var(--sub);
    flex-shrink: 0;
  }
  #paying-amount {
    font-size: 20px;
    font-weight: bold;
    color: var(--text);
  }

  /* トースト */
  #toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    background: rgba(50,30,0,0.88);
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    padding: 18px 36px;
    border-radius: 24px;
    pointer-events: none;
    opacity: 0;
    z-index: 300;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* おつり表示 */
  #change-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(253,246,227,0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 400;
  }
  #change-overlay.show { display: flex; }
  #change-title {
    font-size: 22px;
    font-weight: bold;
    color: var(--correct);
  }
  #change-amount {
    font-size: 46px;
    font-weight: bold;
    color: var(--text);
  }
  #change-sub {
    font-size: 15px;
    color: var(--sub);
  }
  #btn-get-change {
    background: var(--correct);
    color: white;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 40px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 歯車 */
  #gear-btn {
    position: fixed; bottom: 8px; right: 8px;
    width: 32px; height: 32px;
    background: none; border: none; cursor: pointer;
    opacity: 0.18; padding: 0;
    -webkit-tap-highlight-color: transparent; z-index: 100;
  }
  #gear-btn:hover { opacity: 0.45; }

  /* ========== SETTINGS SCREEN ========== */
  #settings-screen {
    flex-direction: column;
    align-items: center;
    padding: 14px 12px;
    gap: 10px;
    overflow-y: auto;
  }
  #settings-title-bar {
    font-size: 18px;
    font-weight: bold;
    color: var(--text);
  }
  .s-card {
    width: 100%; max-width: 560px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .s-card h3 {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .s-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    gap: 8px;
    flex-wrap: wrap;
  }
  .s-row:last-child { border-bottom: none; }
  .s-lbl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: bold;
    color: var(--text);
    flex-shrink: 0;
  }
  .s-ctrl { display: flex; align-items: center; gap: 3px; }
  .step-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: white;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .step-btn:active { background: #fff0cc; }
  .s-val {
    font-size: 15px;
    font-weight: bold;
    color: var(--text);
    min-width: 24px;
    text-align: center;
  }
  .s-range-lbl {
    font-size: 12px;
    color: var(--sub);
    margin: 0 2px;
    white-space: nowrap;
  }

  /* きざみ選択 */
  .kizami-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .kizami-btn {
    padding: 6px 14px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: white;
    font-size: 13px;
    font-weight: bold;
    color: var(--sub);
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .kizami-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  #s-back-btn {
    padding: 10px 44px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 22px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<!-- ========== MAIN ========== -->
<div id="main-screen" class="screen active">

  <!-- 左: 商品＋ボタン -->
  <div id="left-col">
    <div id="product-card">
      <div id="product-emoji">🍩</div>
      <div id="product-price">120円</div>
    </div>
    <button class="action-btn" id="btn-pay" onclick="doPayment()">しはらう</button>
    <button class="action-btn" id="btn-cant" onclick="doCant()">かえない</button>
    <button class="action-btn" id="btn-back" onclick="undoSelection()">もどる</button>
  </div>

  <!-- 右: さいふ -->
  <div id="wallet-col">
    <div id="wallet-title">さいふのなか</div>
    <div id="wallet-area" id="wallet-area"></div>
    <div id="paying-area">
      <div id="paying-label">えらんだおかね</div>
      <div id="paying-amount">0円</div>
    </div>
  </div>
</div>

<!-- ========== おつり ========== -->
<div id="change-overlay">
  <div id="change-title">かえたよ！</div>
  <div id="change-sub" id="change-sub"></div>
  <div id="change-amount"></div>
  <button id="btn-get-change" onclick="receiveChange()">おつりをもらう</button>
</div>

<!-- ========== SETTINGS ========== -->
<div id="settings-screen" class="screen">
  <div id="settings-title-bar">せってい</div>

  <div class="s-card">
    <h3>さいふのなかのおかね（まいすう）</h3>
    <div id="s-wallet-rows"></div>
  </div>

  <div class="s-card">
    <h3>ほしいものの ねだん</h3>
    <div class="s-row">
      <div class="s-lbl">下限</div>
      <div class="s-ctrl">
        <button class="step-btn" onclick="changeMinPrice(-1)">－</button>
        <div class="s-val" id="s-min-price">100</div>
        <button class="step-btn" onclick="changeMinPrice(+1)">＋</button>
        <span class="s-range-lbl">円</span>
      </div>
    </div>
    <div class="s-row">
      <div class="s-lbl">上限</div>
      <div class="s-ctrl">
        <button class="step-btn" onclick="changeMaxPrice(-1)">－</button>
        <div class="s-val" id="s-max-price">800</div>
        <button class="step-btn" onclick="changeMaxPrice(+1)">＋</button>
        <span class="s-range-lbl">円</span>
      </div>
    </div>
    <div class="s-row">
      <div class="s-lbl">きざみ</div>
      <div class="kizami-group" id="kizami-group"></div>
    </div>
  </div>

  <button id="s-back-btn" onclick="closeSettings()">もどる</button>
</div>

<!-- トースト -->
<div id="toast"></div>

<!-- 歯車 -->
<button id="gear-btn" onclick="openSettings()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.8" width="32" height="32">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<script>
// ========== 設定 ==========
const DENOMS = [
  { val: 1000, label: '1000円', type: 'note' },
  { val: 500,  label: '500円',  type: 'coin' },
  { val: 100,  label: '100円',  type: 'coin' },
  { val: 50,   label: '50円',   type: 'coin' },
  { val: 10,   label: '10円',   type: 'coin' },
  { val: 5,    label: '5円',    type: 'coin' },
  { val: 1,    label: '1円',    type: 'coin' },
];

// wallet[val] = count
let wallet = {
  1000: 1,
  500:  2,
  100:  2,
  50:   2,
  10:   4,
  5:    0,
  1:    0,
};

let minPrice = 100;
let maxPrice = 800;
let kizami   = 10;
const KIZAMI_OPTIONS = [1, 10, 50, 100];

let currentPrice = 0;
let currentEmoji = '';

// 選択中のコイン: [{val, uid}]
let selected = [];
let busy = false;

// 商品リスト
const PRODUCTS = [
  ['🍩','ドーナツ'],['🍪','クッキー'],['🍭','キャンディ'],['🍫','チョコレート'],
  ['🧃','ジュース'],['🍞','パン'],['🍙','おにぎり'],['🥪','サンドイッチ'],
  ['🍜','ラーメン'],['🍦','アイスクリーム'],['🍰','ケーキ'],['🍿','ポップコーン'],
  ['✏️','えんぴつ'],['📓','ノート'],['🖍️','クレヨン'],['🎮','ゲーム'],
  ['🧸','ぬいぐるみ'],['⚽','ボール'],['🎨','えのぐ'],['🪀','ヨーヨー'],
];

// ========== SVG ==========
function coinSVG(val, size) {
  const C = {
    1:   { bg:'#b2b2b2', inner:'#d4d4d4', rim:'#444', text:'1',   hole:false },
    5:   { bg:'#c8a84b', inner:'#e0c060', rim:'#5a3a00', text:'5', hole:true  },
    10:  { bg:'#b87333', inner:'#d4946a', rim:'#4a1800', text:'10', hole:false },
    50:  { bg:'#b0b0b0', inner:'#d0d0d0', rim:'#333', text:'50',  hole:true  },
    100: { bg:'#a8a8a8', inner:'#c8c8c8', rim:'#2a2a2a', text:'100', hole:false },
    500: { bg:'#a0a8b0', inner:'#c0c8d0', rim:'#1a3060', text:'500', hole:false },
  };
  const c = C[val];
  const r = size / 2;
  const holeR = size * 0.11;
  const ts = val >= 100 ? size*0.26 : val >= 10 ? size*0.30 : size*0.36;
  const textY = c.hole ? r*0.52 + ts*0.38 : r + ts*0.38;
  const hole = c.hole ? `<circle cx="${r}" cy="${r}" r="${holeR}" fill="#fff8e7" stroke="${c.rim}" stroke-width="1.2"/>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
  <circle cx="${r}" cy="${r}" r="${r-1}" fill="${c.rim}"/>
  <circle cx="${r}" cy="${r}" r="${r-3}" fill="${c.bg}"/>
  <circle cx="${r}" cy="${r}" r="${r-5}" fill="${c.inner}" opacity="0.5"/>
  ${hole}
  <text x="${r}" y="${textY}" text-anchor="middle" font-size="${ts}" font-weight="900" fill="${c.rim}" font-family="BIZ UDPGothic,sans-serif">${c.text}</text>
</svg>`;
}

function noteSVG(val, w, h) {
  const N = {
    1000: { bg:'#ede0c4', border:'#7a5010', inner:'#f8f0dc', text:'1000' },
    5000: { bg:'#e8ddc0', border:'#5a6820', inner:'#f5ecd4', text:'5000' },
  };
  const c = N[val] || N[1000];
  const ts = h * 0.33;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="5" fill="${c.border}"/>
  <rect x="3" y="3" width="${w-6}" height="${h-6}" rx="4" fill="${c.bg}"/>
  <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="3" fill="${c.inner}" opacity="0.55"/>
  <text x="${w*0.5}" y="${h*0.63}" text-anchor="middle" font-size="${ts}" font-weight="900" fill="${c.border}" font-family="BIZ UDPGothic,sans-serif">${c.text}</text>
</svg>`;
}

// ========== 商品生成 ==========
function generateProduct() {
  const p = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)];
  currentEmoji = p[0];
  // きざみに合わせた価格
  const stepsMin = Math.ceil(minPrice / kizami);
  const stepsMax = Math.floor(maxPrice / kizami);
  const steps = Math.max(stepsMin, 1);
  const stepsRange = Math.max(stepsMax - stepsMin + 1, 1);
  currentPrice = (stepsMin + Math.floor(Math.random() * stepsRange)) * kizami;
  // 最低1円以上
  if (currentPrice < 1) currentPrice = kizami;

  document.getElementById('product-emoji').textContent = currentEmoji;
  document.getElementById('product-price').textContent = currentPrice + '円';
}

// ========== さいふ描画 ==========
let uidCounter = 0;
// slot情報: { val, uid, btn }
let moneySlots = [];

function renderWallet() {
  const area = document.getElementById('wallet-area');
  area.innerHTML = '';
  moneySlots = [];

  // 利用可能な金種フィルタ
  const denomsToShow = DENOMS.filter(d => wallet[d.val] !== undefined);

  // エリアの高さを金種数で分割
  const denomCount = denomsToShow.filter(d => wallet[d.val] > 0 || true).length;

  for (const d of denomsToShow) {
    const count = wallet[d.val] || 0;
    const row = document.createElement('div');
    row.className = 'denom-row';
    row.dataset.val = d.val;

    // サイズ決め
    const isNote = d.type === 'note';
    // 行の高さから逆算
    const coinSize = 44;
    const noteW = 72;
    const noteH = 42;

    for (let i = 0; i < count; i++) {
      const uid = ++uidCounter;
      const btn = document.createElement('button');
      btn.className = 'money-btn';
      btn.dataset.val = d.val;
      btn.dataset.uid = uid;

      if (isNote) {
        btn.style.width = noteW + 'px';
        btn.style.height = noteH + 'px';
        btn.innerHTML = noteSVG(d.val, noteW, noteH);
        const ov = document.createElement('div');
        ov.className = 'note-overlay';
        btn.appendChild(ov);
      } else {
        btn.style.width = coinSize + 'px';
        btn.style.height = coinSize + 'px';
        btn.innerHTML = coinSVG(d.val, coinSize);
        const ov = document.createElement('div');
        ov.className = 'coin-overlay';
        btn.appendChild(ov);
      }

      btn.addEventListener('click', () => toggleMoney(d.val, uid, btn));
      row.appendChild(btn);
      moneySlots.push({ val: d.val, uid, btn });
    }

    area.appendChild(row);
  }
}

// ========== お金の選択 ==========
function toggleMoney(val, uid, btn) {
  if (busy) return;
  const idx = selected.findIndex(s => s.uid === uid);
  if (idx >= 0) {
    // 解除
    selected.splice(idx, 1);
    btn.classList.remove('selected');
  } else {
    // 選択
    selected.push({ val, uid, btn });
    btn.classList.add('selected');
  }
  updatePayingDisplay();
}

function updatePayingDisplay() {
  const total = selected.reduce((s, x) => s + x.val, 0);
  document.getElementById('paying-amount').textContent = total + '円';
}

function undoSelection() {
  // 選択を全解除
  for (const s of selected) s.btn.classList.remove('selected');
  selected = [];
  updatePayingDisplay();
}

// ========== しはらう ==========
function doPayment() {
  if (busy) return;
  const total = selected.reduce((s, x) => s + x.val, 0);

  if (total < currentPrice) {
    // 足りない
    showToast('たりないよ', 1600);
    return;
  }

  // 払えた
  busy = true;
  const change = total - currentPrice;

  // アニメーション
  const promises = selected.map((s, i) => new Promise(resolve => {
    setTimeout(() => {
      s.btn.classList.remove('selected');
      s.btn.classList.add('paying');
      setTimeout(resolve, 450);
    }, i * 60);
  }));

  playCharin();

  Promise.all(promises).then(() => {
    // walletから引く
    for (const s of selected) {
      wallet[s.val] = Math.max(0, (wallet[s.val] || 0) - 1);
    }
    selected = [];
    busy = false;
    renderWallet();
    updatePayingDisplay();

    if (change > 0) {
      // おつり表示
      showChangeOverlay(change);
    } else {
      // ぴったり
      checkWalletEmpty();
    }
  });
}

function showChangeOverlay(change) {
  document.getElementById('change-amount').textContent = change + '円';
  // おつりの内訳（オプション）
  const breakdown = makeChangeBreakdown(change);
  document.getElementById('change-sub').textContent = 'おつりは ' + breakdown;
  document.getElementById('change-overlay').classList.add('show');
}

function makeChangeBreakdown(amount) {
  const denomVals = [500, 100, 50, 10, 5, 1];
  let rest = amount;
  const parts = [];
  for (const v of denomVals) {
    const n = Math.floor(rest / v);
    if (n > 0) { parts.push(v + '円×' + n); rest -= v * n; }
  }
  return parts.join('、') || '0円';
}

function receiveChange() {
  const changeEl = document.getElementById('change-amount');
  const change = parseInt(changeEl.textContent);
  document.getElementById('change-overlay').classList.remove('show');

  // おつりをwalletに追加
  const denomVals = [500, 100, 50, 10, 5, 1];
  let rest = change;
  for (const v of denomVals) {
    const n = Math.floor(rest / v);
    if (n > 0) { wallet[v] = (wallet[v] || 0) + n; rest -= v * n; }
  }

  renderWallet();
  checkWalletEmpty();
}

function checkWalletEmpty() {
  const total = Object.values(wallet).reduce((s, c) => s + c, 0);
  if (total === 0) {
    showToast('おかねがなくなったよ', 2000, () => {
      resetWallet();
      generateProduct();
      renderWallet();
    });
    return;
  }
  generateProduct();
}

function resetWallet() {
  wallet = { 1000:1, 500:2, 100:2, 50:2, 10:4, 5:0, 1:0 };
}

// ========== かえない ==========
function doCant() {
  if (busy) return;
  const walletTotal = Object.entries(wallet).reduce((s, [v, c]) => s + Number(v)*c, 0);
  if (walletTotal >= currentPrice) {
    // 間違い: 払えるのに「かえない」を押した
    showToast('かえるよ！', 1400);
    return;
  }
  // 正解
  busy = true;
  playCorrect();
  showToast('そうだね！', 1400, () => {
    busy = false;
    generateProduct();
  });
}

// ========== トースト ==========
function showToast(msg, duration, cb) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    if (cb) setTimeout(cb, 200);
  }, duration);
}

// ========== 音 ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getACtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playCharin() {
  const ctx = getACtx(); const t = ctx.currentTime;
  // チャリーン: 高音3連
  [[1200,t,0.15],[1500,t+0.1,0.15],[1800,t+0.2,0.15]].forEach(([freq,start,dur]) => {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.25, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start+dur+0.02);
  });
}

function playCorrect() {
  const ctx = getACtx(); const t = ctx.currentTime;
  [[880,t,0.18],[1100,t+0.22,0.18]].forEach(([freq,start,dur]) => {
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.28, start+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start+dur+0.05);
  });
}

// ========== 設定 ==========
function openSettings() {
  buildSettingsUI();
  document.getElementById('main-screen').classList.remove('active');
  document.getElementById('settings-screen').classList.add('active');
}

function closeSettings() {
  document.getElementById('settings-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  selected = [];
  renderWallet();
  updatePayingDisplay();
  generateProduct();
}

function buildSettingsUI() {
  // さいふ
  const wr = document.getElementById('s-wallet-rows');
  wr.innerHTML = '';
  for (const d of DENOMS) {
    const row = document.createElement('div');
    row.className = 's-row';
    const isNote = d.type === 'note';
    const thumb = isNote ? noteSVG(d.val, 48, 28) : coinSVG(d.val, 28);
    row.innerHTML = `
      <div class="s-lbl">${thumb}<span>${d.label}</span></div>
      <div class="s-ctrl">
        <button class="step-btn" onclick="changeWallet(${d.val},-1)">－</button>
        <div class="s-val" id="sw-${d.val}">${wallet[d.val]||0}</div>
        <button class="step-btn" onclick="changeWallet(${d.val},+1)">＋</button>
        <span class="s-range-lbl">まい</span>
      </div>`;
    wr.appendChild(row);
  }

  // 価格
  document.getElementById('s-min-price').textContent = minPrice;
  document.getElementById('s-max-price').textContent = maxPrice;

  // きざみ
  const kg = document.getElementById('kizami-group');
  kg.innerHTML = '';
  for (const k of KIZAMI_OPTIONS) {
    const btn = document.createElement('button');
    btn.className = 'kizami-btn' + (k === kizami ? ' active' : '');
    btn.textContent = k + '円';
    btn.onclick = () => {
      kizami = k;
      kg.querySelectorAll('.kizami-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // 価格をきざみに合わせて補正
      minPrice = Math.round(minPrice / kizami) * kizami || kizami;
      maxPrice = Math.round(maxPrice / kizami) * kizami || kizami;
      if (minPrice < kizami) minPrice = kizami;
      if (maxPrice < minPrice) maxPrice = minPrice;
      document.getElementById('s-min-price').textContent = minPrice;
      document.getElementById('s-max-price').textContent = maxPrice;
    };
    kg.appendChild(btn);
  }
}

function changeWallet(val, delta) {
  wallet[val] = Math.max(0, Math.min(10, (wallet[val]||0) + delta));
  const el = document.getElementById('sw-' + val);
  if (el) el.textContent = wallet[val];
}

function changeMinPrice(delta) {
  minPrice = Math.max(kizami, minPrice + delta * kizami);
  if (minPrice > maxPrice) maxPrice = minPrice;
  document.getElementById('s-min-price').textContent = minPrice;
  document.getElementById('s-max-price').textContent = maxPrice;
}

function changeMaxPrice(delta) {
  maxPrice = Math.max(minPrice, maxPrice + delta * kizami);
  document.getElementById('s-max-price').textContent = maxPrice;
}

// ========== 初期化 ==========
window.addEventListener('load', () => {
  setTimeout(() => {
    generateProduct();
    renderWallet();
    updatePayingDisplay();
  }, 50);
});
</script>
